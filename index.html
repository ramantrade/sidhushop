<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIDHU Originals</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:#fff;
}

header{
text-align:center;
padding:40px 20px;
border-bottom:1px solid #222;
}

header h1{
font-size:3rem;
letter-spacing:3px;
}

header p{
margin-top:10px;
color:#aaa;
}

.container{
max-width:1200px;
margin:auto;
padding:40px 20px;
display:flex;
flex-wrap:wrap;
gap:40px;
}

.gallery{
flex:1;
min-width:300px;
}

.main-image{
width:100%;
border-radius:10px;
border:1px solid #222;
}

.thumbnails{
display:flex;
gap:10px;
margin-top:15px;
}

.thumbnails img{
width:80px;
height:80px;
object-fit:cover;
cursor:pointer;
border:1px solid #333;
border-radius:8px;
}

.product{
flex:1;
min-width:300px;
}

.product h2{
font-size:2rem;
margin-bottom:15px;
}

.price{
font-size:2rem;
font-weight:bold;
margin:20px 0;
}

.badge{
display:inline-block;
background:#111;
padding:8px 15px;
border:1px solid #333;
border-radius:30px;
margin-bottom:20px;
}

select{
width:100%;
padding:15px;
background:#111;
color:white;
border:1px solid #333;
margin-bottom:20px;
}

button{
width:100%;
padding:18px;
background:white;
color:black;
font-size:1rem;
font-weight:bold;
border:none;
cursor:pointer;
border-radius:8px;
}

button:hover{
opacity:.9;
}

.features{
margin-top:25px;
line-height:2;
color:#ccc;
}

footer{
text-align:center;
padding:40px 20px;
border-top:1px solid #222;
margin-top:40px;
color:#888;
}
</style>
</head>

<body>

<header>
<h1>SIDHU Originals™</h1>
<p>Inspired by a Legacy</p>
</header>

<div class="container">

<div class="gallery">

<img id="mainImage" src="front.jpg" class="main-image">

<div class="thumbnails">
<img src="front.jpg" onclick="changeImage('front.jpg')">
<img src="back.jpg" onclick="changeImage('back.jpg')">
<img src="detail.jpg" onclick="changeImage('detail.jpg')">
<img src="fabric.jpg" onclick="changeImage('fabric.jpg')">
</div>

</div>

<div class="product">

<span class="badge">FIRST DROP</span>

<h2>SIDHU Originals Black Tee</h2>

<div class="price">₹500</div>

<p>
Premium oversized black T-shirt featuring
SIDHU Originals raised typography.
</p>

<br>

<select>
<option>Select Size</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
</select>

<a href="https://forms.gle/YOUR_FORM_LINK">
<button>PRE-BOOK NOW</button>
</a>

<div class="features">
✓ Premium Feel<br>
✓ Oversized Fit<br>
✓ Breathable Fabric<br>
✓ Limited First Drop<br>
✓ Pre-Booking Open
</div>

</div>

</div>

<footer>
© 2026 SIDHU Originals™<br>
sidhu.shop
</footer>

<script>
function changeImage(image){
document.getElementById("mainImage").src=image;
}
</script>

</body>
</html>
